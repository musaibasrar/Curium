spring.datasource.url=${SPRING_DATASOURCE_JDBC_URL:jdbc:mariadb://localhost:3306/}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVERCLASSNAME:org.mariadb.jdbc.Driver}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-pool-size=2
spring.datasource.hikari.pool-name=HikariPool-1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.multi_tenant_connection_provider=org.ideoholic.curium.model.multitenant.MultiTenantConnectionProviderImpl
spring.jpa.properties.hibernate.tenant_identifier_resolver=org.ideoholic.curium.model.multitenant.SchemaResolver

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s