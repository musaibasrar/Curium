# Test Profile Configuration for Fathimav3 Tenant Testing
# This profile uses in-memory H2 database for testing

# Use in-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate settings for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable multi-tenancy for testing (we'll test this separately)
# spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Keep the same context path for testing
server.servlet.context-path=/school

# JSP configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# File upload settings
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=20MB

# Server settings
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s


