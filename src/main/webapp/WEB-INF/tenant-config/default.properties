# Default Tenant Configuration (Fallback for all tenants)
# Basic Info
tenant.id=school
tenant.name=School Management System
tenant.description=Default School ERP System
tenant.status=active

# Branding & Theming
tenant.branding.logo=logo.png
tenant.branding.favicon=favicon.ico
tenant.branding.primary-color=#2E5C8A
tenant.branding.secondary-color=#B8860B
tenant.branding.accent-color=#FFD700
tenant.branding.font-family=Arial, sans-serif
tenant.branding.theme=default

# === SMART IMAGE RESOLUTION ===
# Default image filenames (used as fallbacks)
tenant.branding.logo=logo.png
tenant.branding.background=backgroundfront.png
tenant.branding.signature=principalsignature.png
tenant.branding.id-signature=idsign.jpeg

# Resource Overrides (empty = use default files)
tenant.resources.css.style=
tenant.resources.css.login=
tenant.resources.css.dashboard=
tenant.resources.images.background=
tenant.resources.images.header=
tenant.resources.js.custom=

# JSP Overrides (empty = use default JSPs)
tenant.jsp.login=
tenant.jsp.dashboard=
tenant.jsp.reports.fees=
tenant.jsp.forms.admission=

# Feature Toggles (default = all enabled)
tenant.features.transport=true
tenant.features.hostel=true
tenant.features.library=true
tenant.features.canteen=true
tenant.features.examination=true
tenant.features.accounting=true
tenant.features.sms=true
tenant.features.email=true

# Business Rules
tenant.business.fee-structure=standard
tenant.business.attendance-policy=strict
tenant.business.exam-pattern=traditional
tenant.business.grading-system=percentage
tenant.business.promotion-criteria=standard
tenant.business.academic-year=2024-2025
tenant.business.currency=INR
tenant.business.timezone=Asia/Kolkata
tenant.business.date-format=dd/MM/yyyy

# Integrations
tenant.integrations.sms-provider=default
tenant.integrations.email-provider=default
tenant.integrations.payment-gateway=default
tenant.integrations.backup-service=default
tenant.integrations.attendance-device=manual

# Custom URLs & Endpoints (empty = use default paths)
tenant.urls.payment=
tenant.urls.results=
tenant.urls.parent-portal=
tenant.urls.helpdesk=

# Validation Rules
tenant.validation.student-id-pattern=STU\\d{4}
tenant.validation.phone-pattern=^\\d{10}$
tenant.validation.email-domain=
tenant.validation.admission-age-min=5
tenant.validation.admission-age-max=18

# Report Configurations
tenant.reports.fee-receipt.template=default-receipt
tenant.reports.transcript.template=default-transcript
tenant.reports.certificate.template=default-certificate
tenant.reports.id-card.template=default-id

# Email Templates
tenant.email.welcome=default-welcome.html
tenant.email.fee-reminder=default-fee-reminder.html
tenant.email.result-notification=default-results.html

# Custom Fields (false = don't show field)
tenant.custom-fields.student.previous-school=false
tenant.custom-fields.student.parent-occupation=optional
tenant.custom-fields.student.transport-required=true
tenant.custom-fields.employee.emergency-contact=optional
tenant.custom-fields.employee.blood-group=false

# Navigation Customization
tenant.navigation.hide-items=
tenant.navigation.add-items=
tenant.navigation.order=dashboard,students,employees,fees,reports

# Permission Overrides
tenant.permissions.parent.view-marks=true
tenant.permissions.parent.download-reports=true
tenant.permissions.student.view-attendance=true
tenant.permissions.teacher.edit-marks=full

# Localization
tenant.locale.language=en
tenant.locale.country=IN
tenant.locale.currency-symbol=₹
tenant.locale.decimal-places=2
